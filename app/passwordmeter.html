<!DOCTYPE html>
<html>

<head>
    <title>Password Strength Meter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0a;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
        }

        .card {
            background: #141414;
            padding: 40px;
            border-radius: 16px;
            border: 1px solid #222;
        }

        h1 {
            color: #fff;
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .input {
            margin-bottom: 18px;
        }

        label {
            display: block;
            color: #888;
            font-size: 0.8rem;
            font-weight: 500;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            font-size: 0.95rem;
            font-family: "Inter", sans-serif;
            background: #0a0a0a;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
            outline: none;
            color: #fff;
            transition: border-color 0.2s ease;
        }

        input:focus {
            border-color: #f97316;
        }

        input::placeholder {
            color: #444;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 46px;
        }

        .toggle-btn {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 14px;
            cursor: pointer;
            opacity: 0.4;
            transition: opacity 0.2s ease;
        }

        .toggle-btn:hover {
            opacity: 1;
        }

        .strength-meter {
            height: 3px;
            background: #222;
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .strength-bar {
            height: 100%;
            width: 0%;
            border-radius: 2px;
            transition: all 0.3s ease;
        }

        .strength-text {
            font-size: 0.75rem;
            color: #444;
            margin-bottom: 16px;
        }

        .requirements {
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 24px;
        }

        .requirements li {
            font-size: 0.7rem;
            color: #444;
            padding: 6px 10px;
            background: #1a1a1a;
            border-radius: 6px;
            border: 1px solid #222;
            transition: all 0.2s ease;
        }

        .requirements li.valid {
            color: #22c55e;
            border-color: #22c55e33;
            background: #22c55e11;
        }

        .strength-bar.weak {
            background: #ef4444;
        }

        .strength-bar.fair {
            background: #eab308;
        }

        .strength-bar.good {
            background: #f97316;
        }

        .strength-bar.strong {
            background: #22c55e;
        }
    </style>
</head>

<body>
    <div class="container">
        <center>
        <h1>Password Strength Meter</h1>
        </center>
        <br>
        <div class="card">
            <div class="input">
                <div class="password-wrapper">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter Your Password Here" />
                    <button type="button" class="toggle-btn" id="toggleBtn">👁️</button>
                </div>
            </div>

            <div class="strength-meter">
                <div class="strength-bar" id="strengthBar"></div>
            </div>

            <p class="strength-text"> Password Strength</p>
            <ul class="requirements">
                <li id="length">8+ Characters</li>
                <li id="lowercase">Lowercase</li>
                <li id="uppercase">Uppercase</li>
                <li id="number">Number</li>
                <li id="special">Special Character</li>
            </ul>
        </div>
    </div>

</body>
<script>
    const passwordInput = document.getElementById("password");
    const toggleBtn = document.getElementById("toggleBtn");
    const strengthBar = document.getElementById("strengthBar");
    const strengthText = document.querySelector(".strength-text");
    const signupForm = document.getElementById("signupForm");

    const requirements = {
        length: document.getElementById("length"),
        lowercase: document.getElementById("lowercase"),
        uppercase: document.getElementById("uppercase"),
        number: document.getElementById("number"),
        special: document.getElementById("special"),
    };

    toggleBtn.addEventListener("click", () => {
        const isPassword = passwordInput.type === "password";
        passwordInput.type = isPassword ? "text" : "password";
        toggleBtn.textContent = isPassword ? "🙈" : "👁️";
    });

    passwordInput.addEventListener("input", () => {
        const password = passwordInput.value;

        let strength = 0;

        const checks = {
            length: password.length >= 8,
            lowercase: /[a-z]/.test(password),
            uppercase: /[A-Z]/.test(password),
            number: /[0-9]/.test(password),
            special: /[-!@#$%^&*(),.?":{}|_<>]/.test(password),
        };

        for (const [key, passed] of Object.entries(checks)) {
            if (passed) {
                requirements[key].classList.add("valid");
                strength++;
            } else {
                requirements[key].classList.remove("valid");
            }
        }

        updateStrength(strength, password.length);
    });

    function updateStrength(strength, length) {
        if (length === 0) {
            strengthBar.style.width = "0%";
            strengthText.textContent = "Enter a password";
            strengthText.style.color = "#666";
            return;
        }

        const levels = [
            { min: 0, width: "20%", class: "weak", text: "Very Weak", color: "#ef4444" },
            { min: 2, width: "40%", class: "weak", text: "Weak", color: "#ef4444" },
            { min: 3, width: "60%", class: "fair", text: "Fair", color: "#f59e0b" },
            { min: 4, width: "80%", class: "good", text: "Good", color: "#ff6b00" },
            { min: 5, width: "100%", class: "strong", text: "Strong 💪", color: "#22c55e" },
        ];

        let level = levels[0];
        for (const l of levels) {
            if (strength >= l.min) {
                level = l;
            }
        }

        strengthBar.style.width = level.width;
        strengthBar.classList.add(level.class);
        strengthText.textContent = level.text;
        strengthText.style.color = level.color;
    }

    signupForm.addEventListener("submit", (e) => {
        e.preventDefault();
        alert("Account created successfully.");
    });
</script>

</html>
