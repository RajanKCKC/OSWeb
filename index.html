<!DOCTYPE html>
<html>

<head>
    <title>OS Web</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>

<body>

    <div id="desktopApps" style="padding-top: 16px; padding-left: 16px; display: flex; gap: 16px;">
        <div class="icon" id="notesicon">
            <img src="notes.png" alt="Notes App" style="padding: 4px; box-sizing: border-box; cursor: pointer;">
            <p class="appname" style="color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.8); margin-top: 6px;">Notes</p>
        </div>
    </div>

    <div id="desktopApps" style="padding-top: 16px; padding-left: 16px; display: flex; gap: 16px;">
        <div class="icon" id="minecrafticon">
            <img src="minecraft.png" alt="Minecraft App" style="padding: 4px; box-sizing: border-box; cursor: pointer;">
            <p class="appname" style="color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.8); margin-top: 6px;">Minecraft</p>
        </div>
    </div>

    <div id="desktopApps" style="padding-top: 16px; padding-left: 16px; display: flex; gap: 16px;">
        <div class="icon" id="solitaireicon">
            <img src="solitaire.png" alt="Solitaire App" style="padding: 4px; box-sizing: border-box; cursor: pointer;">
            <p class="appname" style="color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.8); margin-top: 6px;">Solitaire</p>
        </div>
    </div>

    <div class="window" id="notes" style="top: calc(50% - 150px); display: none; left: calc(50% - 250px); ">
        <div class="windowheader" id="notesheader">
            <div class="controls">
                <div class="close" id="notesclose"></div>
                <div class="minimize"></div>
                <div class="maximize" id="notesmaximize"></div>
            </div>
            <p class="window-title">Notes</p>
            <div style="width: 44px;"></div>
        </div>
        <div  class="window-content" style="background-color: #fff; margin: 6px; border-radius: 12px; width: 480px; padding: 12px; box-sizing: border-box;">
            <input type="text" id="userInputField" placeholder="Start typing here..." style="width: 100%; padding: 12px; border: 1px solid #e0e0e0; border-radius: 8px; font-size: 16px; font-family: inherit; box-sizing: border-box; outline: none;" />
        </div>
    </div>

    <div class="window" id="minecraft" style="top: 16px; display: none; left: 16px; ">
        <div class="windowheader" id="minecraftheader">
            <div class="controls">
                <div class="close" id="minecraftclose"></div>
                <div class="minimize"></div>
                <div class="maximize" id="minecraftmaximize"></div>
            </div>
            <p class="window-title">Minecraft</p>
            <div style="width: 44px;"></div>
        </div>
        <div  class="window-content" style="background-color: #fff; margin: 6px; border-radius: 12px; padding: 0; box-sizing: border-box; overflow: hidden; flex: 1; min-height: 0;">
            <iframe src="https://classic.minecraft.net/" title="Minecraft" style="width: 100%; height: 100%; border: 0; display: block;"></iframe>
        </div>
    </div>

    <div class="window" id="solitaire" style="top: 31px; display: none; left: 32px; width: 600px; height: 400px; ">
        <div class="windowheader" id="solitaireheader">
            <div class="controls">
                <div class="close" id="solitaireclose"></div>
                <div class="minimize"></div>
                <div class="maximize" id="solitairemaximize"></div>
            </div>
            <p class="window-title">Solitaire</p>
            <div style="width: 44px;"></div>
        </div>
        <div  class="window-content" style="background-color: #fff; margin: 6px; border-radius: 12px; padding: 0; box-sizing: border-box; overflow: hidden; flex: 1; min-height: 0;">
            <iframe src="https://play.famobi.com/solitaire-klondike" title="Solitaire" style="width: 100%; height: 100%; border: 0; display: block;"></iframe>
        </div>
    </div>

    <div id="welcome" class="window">
        <div class="windowheader" id="welcomeheader">
            <div class="controls">
                <div id="welcomeclose" class="close"></div>
                <div id="minimize" class="minimize"></div>
                <div id="maximize" class="maximize"></div>
            </div>
            <p class="window-title">Welcome</p>
        </div>
        <br>
        <center>
        <img src="pic.jpg" alt="OS Image" class="avatar">
        </center>
        <h3>Welcome to OS Web</h3>
        <p>Explore apps, take notes, and enjoy your web desktop enviroment.</p>
    </div>

    <div class="taskbar">
        <p style="cursor: pointer" id="welcomeopen">
            <b>OS Web</b>
        </p>
        <p id="timeElement">
            <time datetime="2026-07-21T15:41">7/25/2026 3:41 PM</time>
        </p>
    </div>

</body>
<script>
    function updateTime() {
        var currentTime = new Date().toLocaleString();
        var timeText = document.querySelector("#timeElement");
        if(timeText) { timeText.innerHTML = currentTime; }
    }
    setInterval(updateTime, 1000);
</script>
<script src="script.js"></script>

</html>
